<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Responsive Design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Sudhakar | Full Stack Developer & Freelancer</title>

  <meta
    name="description"
    content="Sudhakar is a Full Stack Developer and Freelancer specializing in MERN Stack, React Native, Next.js, Laravel, and MySQL. Explore web applications, mobile apps, and custom software development projects."
  />

  <meta name="author" content="Sudhakar" />
  <meta name="robots" content="index, follow" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16.png"
  />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/apple-touch-icon.png"
  />

  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="https://sudhakar-portfolio.vercel.app/"
  />

  <!-- Open Graph: Facebook, LinkedIn, WhatsApp -->
  <meta property="og:type" content="website" />
  <meta
    property="og:url"
    content="https://sudhakar-portfolio.vercel.app/"
  />
  <meta
    property="og:title"
    content="Sudhakar | Full Stack Developer & Freelancer"
  />
  <meta
    property="og:description"
    content="Explore Sudhakar's portfolio featuring web development, mobile applications, and custom software solutions using MERN Stack, React Native, Next.js, Laravel, and MySQL."
  />
  <meta property="og:site_name" content="Sudhakar Portfolio" />
  <meta property="og:locale" content="en_IN" />
  <meta
    property="og:image"
    content="https://sudhakar-portfolio.vercel.app/og-image.png"
  />
  <meta
    property="og:image:alt"
    content="Sudhakar - Full Stack Developer and Freelancer"
  />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta
    name="twitter:title"
    content="Sudhakar | Full Stack Developer & Freelancer"
  />
  <meta
    name="twitter:description"
    content="Full Stack Developer and Freelancer specializing in MERN Stack, React Native, Next.js, Laravel, and MySQL."
  />
  <meta
    name="twitter:image"
    content="https://sudhakar-portfolio.vercel.app/og-image.png"
  />
  <meta
    name="twitter:image:alt"
    content="Sudhakar - Full Stack Developer and Freelancer"
  />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Browser Theme Color -->
  <meta name="theme-color" content="#0f172a" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
